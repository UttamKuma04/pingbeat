services:
  - type: postgresql
    name: pingbeat-postgres
    ipAddress: private
    plan: starter
    postgresVersion: 16
    databaseName: pingbeat
    user: pingbeat_user

  - type: redis
    name: pingbeat-redis
    ipAddress: private
    plan: starter
    redisVersion: 7

  - type: web
    name: pingbeat-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: cd backend && python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,pingbeat.in,www.pingbeat.in,api.pingbeat.in"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://pingbeat.in,https://www.pingbeat.in,https://api.pingbeat.in"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://api.pingbeat.in,https://pingbeat.in,https://www.pingbeat.in"
      - key: GOOGLE_CLIENT_ID
        value: "1091250855625-00rf2erbba7u9acaeapknl82p890jst4.apps.googleusercontent.com"
      - key: BREVO_SENDER_EMAIL
        value: "support@pingbeat.in"
      - key: BREVO_SENDER_NAME
        value: "PingBEAT"
      - key: BREVO_API_KEY
        sync: false
      - key: PINGBEAT_APM_API_KEY
        sync: false
      - key: PINGBEAT_APM_INGEST_URL
        value: "https://api.pingbeat.in/api/apm/ingest/"
      - key: DATABASE_URL
        fromDatabase:
          name: pingbeat-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: pingbeat-redis
          type: redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
    plan: standard
    
  - type: background_worker
    name: pingbeat-celery
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: cd backend && celery -A config worker --loglevel=info
    envVars:
      - key: DEBUG
        value: "False"
      - key: BREVO_SENDER_EMAIL
        value: "support@pingbeat.in"
      - key: BREVO_SENDER_NAME
        value: "PingBEAT"
      - key: BREVO_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: pingbeat-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: pingbeat-redis
          type: redis
          property: connectionString
    plan: standard

  - type: background_worker
    name: pingbeat-celery-beat
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: cd backend && celery -A config beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    envVars:
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: pingbeat-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: pingbeat-redis
          type: redis
          property: connectionString
    plan: standard

  - type: static_site
    name: pingbeat-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: pingbeat-backend
          type: web
          property: url
          path: /api
