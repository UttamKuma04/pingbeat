version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pingbeat
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput || true &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --reload"
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - DB_NAME=pingbeat
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - PINGBEAT_APM_API_KEY=${PINGBEAT_APM_API_KEY:-}
      - PINGBEAT_APM_INGEST_URL=${PINGBEAT_APM_INGEST_URL:-http://backend:8000/api/apm/ingest/}
      - PINGBEAT_APM_FLUSH_INTERVAL_SECONDS=30
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app

  celery:
    build: ./backend
    command: celery -A config worker --loglevel=info
    environment:
      - DEBUG=True
      - DB_NAME=pingbeat
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis
      - backend
    volumes:
      - ./backend:/app

  celery-beat:
    build: ./backend
    command: celery -A config beat --loglevel=info
    environment:
      - DEBUG=True
      - DB_NAME=pingbeat
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis
      - backend
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_PROXY_TARGET=http://backend:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
